[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdp"
version = "0.1.0"
description = "Market Data Platform: real-time ingestion, columnar storage and research API for exchange market data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hussein Sayed Ahmad" }]
dependencies = [
    "websockets>=12",
    "pyarrow>=15",
    "duckdb>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "prometheus-client>=0.20",
    "orjson>=3.9",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
mdp = "mdp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/mdp/cli.py" = ["B008"]  # typer.Option() in defaults is the documented idiom
